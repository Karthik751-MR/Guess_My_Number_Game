<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play Guess My Number, a retro-style browser game where you guess a secret number between 1 and 100." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Guess My Number!</title>
  </head>
  <body>
    <div class="stars" aria-hidden="true">
      <div class="star" style="top: 20%; left: 15%"></div>
      <div class="star" style="top: 40%; left: 35%"></div>
      <div class="star" style="top: 60%; left: 75%"></div>
      <div class="star" style="top: 80%; left: 55%"></div>
      <div class="star" style="top: 10%; left: 85%"></div>
      <div class="star" style="top: 30%; left: 25%"></div>
      <div class="star" style="top: 70%; left: 65%"></div>
      <div class="star" style="top: 90%; left: 5%"></div>
    </div>

    <header class="game-header">
      <button class="btn again" type="button">Try Again!</button>
      <p class="between">Between 1 and 100</p>
      <h1>Guess My Number!</h1>
      <div class="number" aria-live="polite">❔</div>
    </header>

    <main class="game-layout">
      <section class="left" aria-label="Guess controls">
        <label class="sr-only" for="guess-input">Enter your guess</label>
        <input
          id="guess-input"
          type="number"
          class="guess"
          min="1"
          max="100"
          placeholder="Enter"
          inputmode="numeric"
        />
        <button type="button" class="btn check">Check!</button>
      </section>

      <section class="right" aria-live="polite">
        <p class="message">🎮 Start Guessing... 🎮</p>
        <p class="label-score">💯 Score: <span class="score">20</span></p>
        <p class="label-highscore">🥇 Highscore: <span class="highscore">0</span></p>
      </section>
    </main>

    <noscript>This game requires JavaScript to run.</noscript>
    <script src="js/script.js"></script>
  </body>
</html>
